<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width, shrink-to-fit=no, interactive-widget=resizes-content"
    />
    <title>%REACT_APP_TITLE%</title>
    <meta name="description" content="%REACT_APP_META_DESCRIPTION%" />
    <meta property="og:title" content="%REACT_APP_TITLE%" />
    <meta property="og:description" content="%REACT_APP_META_DESCRIPTION%" />
    <meta property="og:image" content="%REACT_APP_COVER_IMAGE%" />
    <meta property="og:url" content="%REACT_PUBLIC_URL%" />
    <meta property="og:site_name" content="%REACT_APP_TITLE%" />
    <meta name="twitter:title" content="%REACT_APP_TITLE%" />
    <meta name="twitter:description" content="%REACT_APP_META_DESCRIPTION%" />
    <meta name="twitter:image" content="%REACT_APP_COVER_IMAGE%" />
    <meta name="twitter:card" content="summary" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SPNS Táchira" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/images/LogoRAG.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    %REACT_INJECTED_HEAD%
  </head>

  <body>
    <noscript>
      <div
        style="
          font-family: sans-serif;
          color: #d32f2f;
          font-size: 16px;
          text-align: center;
          padding: 20px;
          background-color: #ffebee;
          border: 1px solid #d32f2f;
          border-radius: 8px;
          margin: 20px;
          max-width: 500px;
          margin: 40px auto;
        "
      >
        <h2 style="margin-bottom: 10px">🚫 JavaScript is Disabled</h2>
        <p>
          This application requires JavaScript to function properly. It looks
          like JavaScript is either
          <strong>disabled</strong> or <strong>blocked</strong> in your browser.
        </p>
        <p style="margin-top: 10px">
          🔧 <strong>How to Enable JavaScript:</strong>
        </p>
        <ul style="text-align: left; display: inline-block; margin: 10px auto">
          <li>Go to your browser settings.</li>
          <li>Find the "JavaScript" section.</li>
          <li>Enable JavaScript and refresh this page.</li>
        </ul>
        <p>If you are using a script blocker, allow scripts from this site.</p>
      </div>
    </noscript>
    <div id="root">
      <style nonce="7e14cf80">
        .temp-loading {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          height: 100vh;
          background: #f8fafc;
          font-family: "Outfit", "Plus Jakarta Sans", system-ui, sans-serif;
        }
        .spns-loader-wrap {
          position: relative;
          width: 72px;
          height: 72px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .spns-loader-ring {
          width: 72px;
          height: 72px;
          border-radius: 50%;
          border: 3.5px solid #e0f2fe;
          border-top-color: #00a3ff;
          border-right-color: #38bdf8;
          animation: spns-spin 1.1s linear infinite;
        }
        .spns-loader-badge {
          position: absolute;
          width: 42px;
          height: 42px;
          border-radius: 12px;
          background: linear-gradient(135deg, #00a3ff, #0076be);
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 6px 16px rgba(0, 163, 255, 0.3);
        }
        .spns-loader-text {
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: #0076be;
        }
        @keyframes spns-spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="temp-loading" role="status" aria-label="Cargando SPNS Táchira">
        <div class="spns-loader-wrap">
          <div class="spns-loader-ring"></div>
          <div class="spns-loader-badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12h4l2.2-5 3.6 10 2.2-5H21" />
            </svg>
          </div>
        </div>
        <div class="spns-loader-text">SPNS Táchira · Iniciando</div>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
    <!-- Script injected by Vite from environment variable -->
    %REACT_INJECTED_HTML%
  </body>
</html>
